name: gentle_paths_academy
description: "Flores Gong Nota — Apprentissage de l'écriture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.0.0
  provider: ^6.1.0
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.0
  path_drawing: ^1.0.1
  image_picker: ^1.1.2
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800
    - family: Comic Neue
      fonts:
        - asset: assets/fonts/ComicNeue-Light.ttf
          weight: 300
    - family: Cursive Standard
      fonts:
        - asset: assets/fonts/CursiveStandard.ttf
          weight: 400
    # Police accessibilité (dyslexie) — OpenDyslexic, licence SIL Open Font
    # License 1.1 (libre, redistribution autorisée). Voir Profil > Réglages.
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
          weight: 400
